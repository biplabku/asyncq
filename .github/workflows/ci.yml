name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asyncq
          POSTGRES_PASSWORD: asyncq
          POSTGRES_DB: asyncq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asyncq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test core, redis, axum, actix
        run: cargo test --workspace --exclude asyncq-postgres
        env:
          REDIS_URL: redis://127.0.0.1/

      - name: Test postgres
        run: cargo test -p asyncq-postgres
        env:
          DATABASE_URL: postgres://asyncq:asyncq@localhost/asyncq

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
