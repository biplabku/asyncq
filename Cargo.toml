[workspace]
members = [
    "asyncq",
    "asyncq-derive",
    "asyncq-redis",
    "asyncq-postgres",
    "asyncq-axum",
    "asyncq-actix",
]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2021"
authors = ["Biplab Das <dasbiplabtu@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/biplabku/asyncq"
documentation = "https://docs.rs/asyncq"
rust-version = "1.75"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Errors
thiserror = "2"

# Async traits
async-trait = "0.1"

# Tracing
tracing = "0.1"

# Internal crates
asyncq = { path = "asyncq", version = "0.1.7" }
asyncq-derive = { path = "asyncq-derive", version = "0.1.7" }
