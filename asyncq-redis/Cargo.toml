[package]
name = "asyncq-redis"
description = "Redis backend for asyncq — production-grade async job queue for Rust"
keywords = ["jobs", "queue", "redis", "background", "worker"]
categories = ["asynchronous", "web-programming", "database"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
asyncq.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
serde_json = "1"
futures.workspace = true

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "with_state"
path = "examples/with_state.rs"

[[example]]
name = "cron"
path = "examples/cron.rs"
