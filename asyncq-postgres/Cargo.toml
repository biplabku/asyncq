[package]
name = "asyncq-postgres"
description = "PostgreSQL backend for asyncq — background jobs without Redis, transactional enqueue with SKIP LOCKED"
keywords = ["queue", "postgres", "background", "task", "jobs"]
categories = ["asynchronous", "web-programming", "database"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
asyncq.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio"] }
